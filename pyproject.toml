[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ensemble-dwd"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.7/dwd-1.3.7-cp311-abi3-win_amd64.whl#sha256=2b1d09bfeeaeddd928b5920d9298827b32effd758d5ebff2fa804dbdb2be3677 ; platform_system == 'Windows' and platform_machine == 'AMD64' and platform_python_implementation == 'CPython'",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.7/dwd-1.3.7-py3-none-any.whl#sha256=ccfa52124121fdffecf19d9cd9ef637715a4032a5032e6531382dd431c5610e0 ; platform_system != 'Windows' or platform_machine != 'AMD64' or platform_python_implementation != 'CPython'",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.flit.module]
name = "ensemble_dwd"

[tool.flit.sdist]
include = ["docs/", "examples/", "tests/", "CITATION.cff", "CHANGELOG.md", "VALIDATION.md", ".github/", ".gitattributes"]
exclude = ["**/__pycache__/**", "**/*.pyc", "build/", "dist/"]
