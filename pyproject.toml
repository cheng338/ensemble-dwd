[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ensemble-dwd"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.8/dwd-1.3.8-cp311-abi3-win_amd64.whl#sha256=125f3e46e52ceaa786266162b141791e0016f558265231db6cc898740d2999ee ; platform_system == 'Windows' and platform_machine == 'AMD64' and platform_python_implementation == 'CPython'",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.8/dwd-1.3.8-py3-none-any.whl#sha256=27eaa3f12e9b980e27f2113b0abf1b5376d53e717beb48303a2a669194c7b212 ; platform_system != 'Windows' or platform_machine != 'AMD64' or platform_python_implementation != 'CPython'",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.flit.module]
name = "ensemble_dwd"

[tool.flit.sdist]
include = ["docs/", "examples/", "tests/", "CITATION.cff", "CHANGELOG.md", "VALIDATION.md", ".github/", ".gitattributes"]
exclude = ["**/__pycache__/**", "**/*.pyc", "build/", "dist/"]
