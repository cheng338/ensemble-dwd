[build-system]
requires = ["flit_core>=3.9,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "ensemble-dwd"
dynamic = ["version", "description"]
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Chang Cheng"}]
dependencies = [
    "numpy",
    "scipy",
    "scikit-learn>=1.6",
    "joblib>=1.3",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.5/dwd-1.3.5-cp311-abi3-win_amd64.whl#sha256=f792d5fa251c57526990221c7d573274e50a99da60e5f508f51515f8f622435e ; platform_system == 'Windows' and platform_machine == 'AMD64' and platform_python_implementation == 'CPython'",
    "dwd @ https://github.com/cheng338/dwd/releases/download/v1.3.5/dwd-1.3.5-py3-none-any.whl#sha256=45ec234a373f6080d805089bb24fa869e6de57a1660c3988aeba6ae2c529cb13 ; platform_system != 'Windows' or platform_machine != 'AMD64' or platform_python_implementation != 'CPython'",
]
classifiers = [
    "Private :: Do Not Upload",
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Information Analysis",
]

[tool.flit.module]
name = "ensemble_dwd"

[tool.flit.sdist]
include = ["docs/", "examples/", "tests/", "CITATION.cff", "CHANGELOG.md", "VALIDATION.md", ".github/", ".gitattributes"]
exclude = ["**/__pycache__/**", "**/*.pyc", "build/", "dist/"]
