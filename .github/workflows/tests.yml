name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Download the validated DWD wheel
        run: >-
          python -m pip download --no-index
          --find-links "https://github.com/cheng338/dwd/releases/expanded_assets/v1.3.19"
          --no-deps --require-hashes -r requirements-dwd.txt --dest .ci-wheels/dwd
      - name: Install the exact validated DWD wheel
        run: python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/dwd
      - name: Build and install the ensemble wheel to be tested
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci-wheels/ensemble .
          python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/ensemble --extras test
      - name: Prepare tests outside the package source tree
        run: >-
          python -I -B tests/ci_artifacts.py bundle
          --destination "${{ runner.temp }}/ensemble-installed-tests"
      - name: Verify installed wheel origins, payloads and DWD backend
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: >-
          python -I -B tests/ci_artifacts.py check
          --dwd-wheel-dir "${{ github.workspace }}/.ci-wheels/dwd"
          --ensemble-wheel-dir "${{ github.workspace }}/.ci-wheels/ensemble" --backend wheel
      - name: Run the complete bundled test suite
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: python -I -B -m pytest tests -o "python_files=test*.py" -ra

  minimum-dependencies:
    name: Lower supported sklearn and joblib release lines
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Download the validated DWD wheel
        run: >-
          python -m pip download --no-index
          --find-links "https://github.com/cheng338/dwd/releases/expanded_assets/v1.3.19"
          --no-deps --require-hashes -r requirements-dwd.txt --dest .ci-wheels/dwd
      - name: Install compatible older numerical dependencies
        run: >-
          python -m pip install
          "numpy==1.26.4" "scipy==1.12.0"
          "scikit-learn==1.6.1" "joblib==1.3.2"
      - name: Install the exact validated DWD wheel
        run: python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/dwd
      - name: Build and install the ensemble wheel to be tested
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci-wheels/ensemble .
          python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/ensemble --extras test
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Prepare tests outside the package source tree
        run: >-
          python -I -B tests/ci_artifacts.py bundle
          --destination "${{ runner.temp }}/ensemble-installed-tests"
      - name: Verify installed wheel origins, payloads and DWD backend
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: >-
          python -I -B tests/ci_artifacts.py check
          --dwd-wheel-dir "${{ github.workspace }}/.ci-wheels/dwd"
          --ensemble-wheel-dir "${{ github.workspace }}/.ci-wheels/ensemble" --backend wheel
      - name: Run the complete bundled test suite
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: python -I -B -m pytest tests -o "python_files=test*.py" -ra
