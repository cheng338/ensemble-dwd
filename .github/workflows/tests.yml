name: Tests

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 61347173d522b372fd8eb253263e819c6f3be1c7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Check out the paired DWD source
        uses: actions/checkout@v7.0.1
        with:
          repository: cheng338/dwd
          ref: 6cd484c54fb49a36cce2e4fe259db2a75a7d9ff4
          path: .ci-dwd-source
      - name: Verify candidate source commits
        shell: python
        run: |
          import subprocess
          commits = [subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
                     for path in (".", ".ci-dwd-source")]
          if commits != ["61347173d522b372fd8eb253263e819c6f3be1c7", "6cd484c54fb49a36cce2e4fe259db2a75a7d9ff4"]:
              raise SystemExit(f"Unexpected candidate source commits: {commits}")
          print("VALIDATED_CANDIDATE_SOURCES", *commits, flush=True)
      - name: Build the paired DWD wheel
        env:
          DWD_BUILD_ACCEL: ${{ runner.os == 'Windows' && '1' || '0' }}
        run: python -m pip wheel --no-deps --wheel-dir .ci-wheels/dwd ./.ci-dwd-source
      - name: Install the paired DWD wheel
        run: python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/dwd
      - name: Build and install the ensemble wheel to be tested
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci-wheels/ensemble .
          python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/ensemble --extras test
      - name: Prepare tests outside the package source tree
        run: >-
          python -I -B tests/ci_artifacts.py bundle
          --destination "${{ runner.temp }}/ensemble-installed-tests"
      - name: Verify installed wheel origins, payloads and DWD backend
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: >-
          python -I -B tests/ci_artifacts.py check
          --dwd-wheel-dir "${{ github.workspace }}/.ci-wheels/dwd"
          --ensemble-wheel-dir "${{ github.workspace }}/.ci-wheels/ensemble"
          --backend "${{ runner.os == 'Windows' && 'native' || 'portable' }}"
          --route-contract current
          --expected-platform "${{ runner.os == 'Windows' && 'windows' || 'linux' }}"
          --expected-python "${{ matrix.python-version }}"
      - name: Run the complete bundled test suite
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: python -I -B -m pytest tests -o "python_files=test*.py" -ra

  minimum-dependencies:
    name: Lower supported sklearn and joblib release lines
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: 61347173d522b372fd8eb253263e819c6f3be1c7
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Check out the paired DWD source
        uses: actions/checkout@v7.0.1
        with:
          repository: cheng338/dwd
          ref: 6cd484c54fb49a36cce2e4fe259db2a75a7d9ff4
          path: .ci-dwd-source
      - name: Verify candidate source commits
        shell: python
        run: |
          import subprocess
          commits = [subprocess.check_output(["git", "-C", path, "rev-parse", "HEAD"], text=True).strip()
                     for path in (".", ".ci-dwd-source")]
          if commits != ["61347173d522b372fd8eb253263e819c6f3be1c7", "6cd484c54fb49a36cce2e4fe259db2a75a7d9ff4"]:
              raise SystemExit(f"Unexpected candidate source commits: {commits}")
          print("VALIDATED_CANDIDATE_SOURCES", *commits, flush=True)
      - name: Build the paired DWD wheel
        env:
          DWD_BUILD_ACCEL: '0'
        run: python -m pip wheel --no-deps --wheel-dir .ci-wheels/dwd ./.ci-dwd-source
      - name: Install compatible older numerical dependencies
        run: >-
          python -m pip install
          "numpy==1.26.4" "scipy==1.12.0"
          "scikit-learn==1.6.1" "joblib==1.3.2" "pandas==2.2.3"
      - name: Install the paired DWD wheel
        run: python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/dwd
      - name: Build and install the ensemble wheel to be tested
        run: |
          python -m pip wheel --no-deps --wheel-dir .ci-wheels/ensemble .
          python -I -B tests/ci_artifacts.py install --wheel-dir .ci-wheels/ensemble --extras test
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Prepare tests outside the package source tree
        run: >-
          python -I -B tests/ci_artifacts.py bundle
          --destination "${{ runner.temp }}/ensemble-installed-tests"
      - name: Verify installed wheel origins, payloads and DWD backend
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: >-
          python -I -B tests/ci_artifacts.py check
          --dwd-wheel-dir "${{ github.workspace }}/.ci-wheels/dwd"
          --ensemble-wheel-dir "${{ github.workspace }}/.ci-wheels/ensemble" --backend portable
          --route-contract current
          --expected-platform linux
          --expected-python 3.11
      - name: Run the complete bundled test suite
        working-directory: ${{ runner.temp }}/ensemble-installed-tests
        run: python -I -B -m pytest tests -o "python_files=test*.py" -ra
