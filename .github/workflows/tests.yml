name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12", "3.13"]
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install validated DWD wheel
        run: >-
          python -m pip install --no-index
          --find-links "https://github.com/cheng338/dwd/releases/expanded_assets/v1.3.12"
          --no-deps --force-reinstall --require-hashes -r requirements-dwd.txt
      - name: Install package and pinned DWD dependency
        run: python -m pip install .
      - name: Run tests
        run: python -m unittest discover -s tests -v

  minimum-dependencies:
    name: Lower supported sklearn and joblib release lines
    runs-on: ubuntu-latest
    env:
      OMP_NUM_THREADS: "1"
      OPENBLAS_NUM_THREADS: "1"
      MKL_NUM_THREADS: "1"
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.11"
      - name: Install validated DWD wheel
        run: >-
          python -m pip install --no-index
          --find-links "https://github.com/cheng338/dwd/releases/expanded_assets/v1.3.12"
          --no-deps --force-reinstall --require-hashes -r requirements-dwd.txt
      - name: Install compatible older numerical dependencies and package
        run: >-
          python -m pip install
          "numpy==1.26.4" "scipy==1.12.0"
          "scikit-learn==1.6.1" "joblib==1.3.2" .
      - name: Check installed dependency consistency
        run: python -m pip check
      - name: Run tests
        run: python -m unittest discover -s tests -v
